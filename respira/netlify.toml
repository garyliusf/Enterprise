# Netlify config for the respira site.
# Works two ways:
#   • this folder pushed as its own repo  → no extra settings needed
#   • the Enterprise repo connected       → set Base directory to "respira"

[build]
  publish = "."

# The HTML must never be cached hard, or edits won't show up for people
# who have already visited. Netlify still revalidates via ETag, so this
# is cheap.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets are content-addressed by filename here (we rename on change),
# so they can be cached hard. This is what makes repeat visits instant.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------
# Old Wix URLs. Google still has these indexed and people still
# have them bookmarked; 301 them to the matching section of the
# one-pager rather than serving a 404. Specific rules first, then
# a catch-all. These are unforced, so they never shadow real files
# (assets, sitemap, etc.) — Netlify only applies them when nothing
# on disk matches.
# ---------------------------------------------------------------

[[redirects]]
  from = "/about-me"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/yoga"
  to = "/#yoga"
  status = 301

[[redirects]]
  from = "/breath"
  to = "/#breathwork"
  status = 301

[[redirects]]
  from = "/transformational-breath"
  to = "/#breathwork"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

# Sections that no longer exist on the new site land on the homepage.
[[redirects]]
  from = "/rituals"
  to = "/"
  status = 301

[[redirects]]
  from = "/press"
  to = "/"
  status = 301

[[redirects]]
  from = "/podcast"
  to = "/#breathwork"
  status = 301

# Wix language prefixes
[[redirects]]
  from = "/it/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/"
  status = 301

# No catch-all: Netlify drops "/*" -> "/" as a redirect loop. Unmatched
# paths fall through to 404.html, which is branded and links home.
