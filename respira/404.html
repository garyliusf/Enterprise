<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — respira</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{ --night:#0C2A36; --gold:#D9AE5F; --stone:#C4B49E; --cream:#F2EBDD; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--night); color:var(--stone);
    font-family:'Jost',sans-serif; font-weight:300;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 20px; gap:6px;
  }
  img{ width:76px; height:auto; margin-bottom:26px; }
  h1{
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:300; font-style:italic;
    color:var(--cream); font-size:clamp(30px,5vw,46px); line-height:1.2; margin:0 0 14px;
  }
  p{ margin:0 0 34px; font-size:15px; letter-spacing:.02em; }
  a{
    display:inline-flex; align-items:center; height:44px; padding:0 30px;
    background:var(--gold); color:var(--night); text-decoration:none;
    font-size:14px; letter-spacing:.1em; text-transform:capitalize;
    transition:background-color .4s ease;
  }
  a:hover{ background:#E2B563; }
</style>
</head>
<body>
  <img src="/assets/owl-gold.svg" alt="">
  <h1>This page has moved</h1>
  <p>Everything now lives on one page.</p>
  <a href="/">Return home</a>
</body>
</html>
