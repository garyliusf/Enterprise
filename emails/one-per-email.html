<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transactional emails — true Rails output</title>
<style>
*{box-sizing:border-box}
:root{--bg:#faf9f8;--panel:#fff;--line:#e6e4e1;--ink:#16151a;--mute:#6d6a66;
  --accent:#1389fd;--sidebar:#f2f0ee;--ok:#0f8a55}
@media (prefers-color-scheme:dark){:root{--bg:#131316;--panel:#1b1b1f;--line:#2c2c32;
  --ink:#f0eff2;--mute:#94919b;--sidebar:#17171a;--ok:#3ec98a}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:330px 1fr;height:100vh;overflow:hidden}
kbd{font:11px ui-monospace,Menlo,monospace;background:var(--line);border-radius:3px;padding:1px 5px}
aside{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 10px}
.brand h1{font-size:15px;margin:0 0 3px;letter-spacing:-.2px}
.brand p{margin:0;font-size:11.5px;color:var(--mute)}
.badge{display:inline-block;background:var(--ok);color:#fff;font-size:9.5px;font-weight:700;
  letter-spacing:.6px;padding:2px 6px;border-radius:3px;margin-bottom:6px}
.search{padding:0 14px 12px}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--ink);font-size:13px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.list{overflow-y:auto;flex:1;padding:0 8px 20px;min-height:0}
.grp{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mute);
  padding:14px 10px 6px;font-weight:600}
.grp span{opacity:.6;font-weight:400}
.item{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel)}
.item.on{background:var(--accent);border-color:var(--accent)}
.item.on .a,.item.on .s{color:#fff}.item.on .s{opacity:.85}
.a{font:12.5px/1.35 ui-monospace,Menlo,monospace;display:block;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{font-size:11.5px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;background:#c9a227;
  color:#2a2205;margin-left:5px;vertical-align:1px;font-weight:600}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{padding:16px 24px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.crumb{font:11px ui-monospace,Menlo,monospace;color:var(--mute)}
h2{font-size:19px;margin:5px 0 8px;letter-spacing:-.3px;font-family:ui-monospace,Menlo,monospace}
.hdrs{font-size:12.5px;color:var(--mute);margin:0 0 14px;display:grid;gap:2px}
.hdrs b{color:var(--ink);font-weight:600}
.bar{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:7px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mute);font:500 12px/1 inherit;
  padding:6px 12px;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);margin-right:-12px}
.tabs{display:flex;gap:2px;margin-top:14px}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mute);
  font:500 13px/1 inherit;padding:10px 14px;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.stage{flex:1;overflow:auto;padding:28px;display:flex;justify-content:center;align-items:flex-start;min-height:0}
.frame{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.07);transition:width .22s ease;flex:none}
.frame iframe{display:block;width:100%;height:100%;border:0;background:#fff}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 24px;
  width:100%;max-width:820px;white-space:pre-wrap;word-break:break-word;
  font:12.5px/1.7 ui-monospace,Menlo,monospace;color:var(--ink);margin:0}
.empty{color:var(--mute);font-size:13px;padding:40px;text-align:center;width:100%}
.note{font-size:11.5px;color:var(--mute);padding:8px 24px;border-top:1px solid var(--line);background:var(--panel)}
@media (max-width:860px){body{grid-template-columns:1fr}aside{display:none}}
</style></head><body>

<aside>
  <div class="brand">
    <span class="badge">TRUE RAILS OUTPUT</span>
    <h1>Transactional emails</h1>
    <p><span id="count"></span> · captured from /rails/mailers</p>
  </div>
  <div class="search"><input id="q" placeholder="Search name or subject…" autocomplete="off"></div>
  <div class="list" id="list"></div>
</aside>

<main>
  <header>
    <div class="crumb" id="crumb"></div>
    <h2 id="title"></h2>
    <div class="hdrs" id="hdrs"></div>
    <div class="bar">
      <span class="lbl">Viewport</span>
      <div class="seg" id="vp">
        <button data-w="640" class="on">Desktop</button>
        <button data-w="375">Mobile</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button data-t="html" class="on">Preview</button>
      <button data-t="text">Plain text</button>
    </div>
  </header>
  <div class="stage" id="stage"></div>
  <div class="note">Rendered by Rails with real seeded records — subjects, recipients and
    interpolated values are exactly what the app produces. Arrow keys <kbd>↑</kbd><kbd>↓</kbd>
    move through the list, <kbd>d</kbd>/<kbd>m</kbd> switch viewport.</div>
</main>

let cur = EMAILS[0], vp = 640, tab = 'html', filter = '';
const $ = s => document.querySelector(s);
$('#count').textContent = EMAILS.length + ' previews';

function drawList(){
  const box = $('#list'); box.innerHTML = '';
  [...new Set(EMAILS.map(e => e.group))].forEach(g => {
    const items = EMAILS.filter(e => e.group === g && (!filter ||
      e.action.toLowerCase().includes(filter) || (e.subject||'').toLowerCase().includes(filter)));
    if (!items.length) return;
    const h = document.createElement('div');
    h.className = 'grp'; h.innerHTML = g + ' <span>' + items.length + '</span>';
    box.appendChild(h);
    items.forEach(e => {
      const d = document.createElement('div');
      d.className = 'item' + (e.id === cur.id ? ' on' : '');
      d.innerHTML = '<span class="a">' + e.action +
        (!e.html ? '<span class="flag">TEXT ONLY</span>' : '') +
        (!e.text ? '<span class="flag">NO TEXT</span>' : '') +
        '</span><span class="s">' + (e.subject || '—') + '</span>';
      d.onclick = () => { cur = e; draw(); };
      box.appendChild(d);
    });
  });
}

function draw(){
  drawList();
  $('#crumb').textContent = cur.path;
  $('#title').textContent = cur.action;
  $('#hdrs').innerHTML =
    '<div><b>Subject:</b> ' + (cur.subject || '—') + '</div>' +
    '<div><b>From:</b> ' + (cur.from || '—') + ' &nbsp;·&nbsp; <b>To:</b> ' + (cur.to || '—') + '</div>';
  document.querySelectorAll('#vp button').forEach(b => b.classList.toggle('on', +b.dataset.w === vp));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));

  const stage = $('#stage'); stage.innerHTML = '';
  if (tab === 'html'){
    if (!cur.html){ stage.innerHTML = '<div class="empty">No HTML part — this email sends plaintext only.</div>'; return; }
    const w = document.createElement('div');
    w.className = 'frame'; w.style.width = vp + 'px';
    w.style.height = 'min(1100px, calc(100vh - 260px))';
    const f = document.createElement('iframe');
    f.setAttribute('sandbox',''); f.srcdoc = cur.html;
    w.appendChild(f); stage.appendChild(w);
  } else {
    const pre = document.createElement('pre');
    pre.textContent = cur.text || '(no plain-text part for this email)';
    stage.appendChild(pre);
  }
}

$('#vp').onclick   = e => { if(e.target.dataset.w){ vp = +e.target.dataset.w; draw(); } };
$('#tabs').onclick = e => { if(e.target.dataset.t){ tab = e.target.dataset.t; draw(); } };
$('#q').oninput    = e => { filter = e.target.value.toLowerCase().trim(); drawList(); };
document.onkeydown = e => {
  if (e.target.tagName === 'INPUT') return;
  const i = EMAILS.indexOf(cur);
  if (e.key === 'ArrowDown'){ cur = EMAILS[Math.min(i+1, EMAILS.length-1)]; draw(); e.preventDefault(); }
  if (e.key === 'ArrowUp'){   cur = EMAILS[Math.max(i-1, 0)]; draw(); e.preventDefault(); }
  if (e.key === 'd'){ vp = 640; draw(); }
  if (e.key === 'm'){ vp = 375; draw(); }
};
draw();
