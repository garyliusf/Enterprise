<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Founders Week | Bolt</title>
    <meta name="description" content="Founders Week on Bolt: a free build weekend Oct 17–18, a week of founder sessions, and a competition for the product you built in Bolt." />
    <meta property="og:title" content="Founders Week | Bolt" />
    <meta property="og:description" content="A free build weekend, a week of founder sessions, and a competition for the product you built in Bolt." />
    <meta name="theme-color" content="#021a57" />
    <!-- Theme resolver, same model as the marketing site: light by default,
         dark for visitors whose OS asks for it. Runs before paint so there is
         no flash. Order: ?theme=light|dark (preview override) → saved choice
         (localStorage "sc-theme") → OS preference → light. Follows OS changes
         live and fires "sc-themechange" so canvases re-tint. -->
    <script>
      (function () {
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var q = new URLSearchParams(location.search).get('theme');
        var saved = null;
        try { saved = localStorage.getItem('sc-theme'); } catch (e) {}
        function ok(v) { return v === 'light' || v === 'dark'; }
        function apply() {
          var t = ok(q) ? q : ok(saved) ? saved : mq.matches ? 'dark' : 'light';
          root.setAttribute('data-theme', t);
          root.style.colorScheme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#021a57');
        }
        apply();
        var onChange = function () { apply(); document.dispatchEvent(new Event('sc-themechange')); };
        if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Literata:ital,opsz,wght@1,7..72,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
