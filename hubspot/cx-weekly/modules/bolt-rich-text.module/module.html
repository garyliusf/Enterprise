{# Body copy. Inline styles are re-applied to pasted markup by the template CSS.
   Self-contained: carries its own 600px table — dnd_area wraps modules in divs,
   so bare <tr> rows would be hoisted out of the template table and go full-bleed. #}
<table role="presentation" class="wrap" width="600" align="center" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;margin:0 auto;">
<tr><td bgcolor="#ffffff" class="px k-light rt" style="background:#ffffff;padding:0 36px 8px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#000000;">
  {{ module.body_text }}
</td></tr>
</table>
