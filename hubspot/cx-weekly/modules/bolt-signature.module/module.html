{# Self-contained: carries its own 600px table (dnd_area div-wraps modules).
   Bottom corners round off the white card. #}
<table role="presentation" class="wrap" width="600" align="center" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;margin:0 auto;">
<tr><td bgcolor="#ffffff" class="px k-light" style="background:#ffffff;border-radius:0 0 12px 12px;padding:0 36px 36px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <p class="k-ink" style="margin:32px 0 0;font-size:16px;line-height:1.6;color:#000000;text-align:center;">{{ module.closing }}<br><span style="font-weight:600;">{{ module.signer }}</span></p>
</td></tr>
</table>
