{# Self-contained: carries its own 600px table (dnd_area div-wraps modules). #}
<table role="presentation" class="wrap" width="600" align="center" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;margin:0 auto;">
<tr><td bgcolor="#ffffff" class="px k-light" style="background:#ffffff;padding:8px 36px 24px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table class="btn-t" cellpadding="0" cellspacing="0" {% if module.align == "center" %}align="center" style="margin:0 auto;"{% endif %}><tr>
    <td class="k-btn" style="background:#1389fd;border-radius:2px;"><a href="{{ module.url.url.href }}" style="display:inline-block;min-width:180px;box-sizing:border-box;padding:15px 28px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:1.25;color:#FFFFFF;text-decoration:none;text-align:center;white-space:nowrap;">{{ module.button_label }}</a></td>
  </tr></table>
</td></tr>
</table>
