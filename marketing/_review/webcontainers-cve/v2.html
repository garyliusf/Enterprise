<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebContainers Visual v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Literata:ital,opsz,wght@1,7..72,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ddd; }
  .frame {
    width: 1024px; height: 410px; position: relative; overflow: hidden;
    background: #f7f7f5; color: #141414;
    font-family: 'Schibsted Grotesk', sans-serif;
  }
  canvas { position: absolute; inset: 0; }
  .copy { position: absolute; left: 68px; top: 0; bottom: 0; width: 420px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #1488FC; margin-bottom: 16px; }
  h1 { font-size: 46px; font-weight: 500; line-height: 1.08; letter-spacing: -1px; }
  h1 em { font-family: 'Literata', serif; font-style: italic; font-weight: 400; letter-spacing: -0.5px; }
  .tag { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(20,20,20,0.45); }
</style>
</head>
<body>
<div class="frame">
  <canvas id="c"></canvas>
  <div class="copy">
    <div class="eyebrow">Node.js CVE-2026-111497</div>
    <h1>Running <em>untrusted</em> code in WebContainers</h1>
  </div>
  <div class="tag" style="left:526px; top:84px;">browser tab</div>
  <div class="tag" style="left:874px; top:300px;">~/.ssh</div>
</div>

<script>
document.fonts.ready.then(() => {
  const c = document.getElementById('c');
  const W = 1024, H = 410, dpr = window.devicePixelRatio || 1;
  c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
  const x = c.getContext('2d'); x.scale(dpr, dpr);

  // Sandbox wall (browser tab outline)
  const B = { l: 520, t: 104, r: 800, b: 330 };
  x.strokeStyle = 'rgba(20,20,20,0.85)'; x.lineWidth = 1.5;
  x.beginPath();
  x.moveTo(B.l, B.t); x.lineTo(B.r, B.t); x.lineTo(B.r, B.b); x.lineTo(B.l, B.b); x.closePath(); x.stroke();

  // Dot field inside: density + size rise toward the right wall, as if pressing against it
  const S = 7;
  for (let px = B.l + 6; px < B.r - 2; px += S) {
    for (let py = B.t + 6; py < B.b - 2; py += S) {
      const u = (px - B.l) / (B.r - B.l);
      const v = (py - B.t) / (B.b - B.t);
      const wave = 0.5 + 0.5 * Math.sin(px / 23 + Math.sin(py / 31) * 2.2);
      const edge = Math.pow(u, 2.4);
      const p = 0.18 + 0.82 * edge * (0.55 + 0.45 * wave);
      const r = ((Math.sin(px * 12.9898 + py * 78.233) * 43758.5453) % 1 + 1) % 1;
      if (r > p) continue;
      const s = u > 0.93 ? 3 : 2;
      x.fillStyle = `rgba(20,136,252,${(0.35 + 0.65 * edge).toFixed(2)})`;
      x.fillRect(px, py, s, s);
    }
  }

  // The key, outside the wall, drawn as an ink dot matrix
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const k = o.getContext('2d'); k.fillStyle = '#000';
  const cx = 902, cy = 216;
  k.beginPath(); k.arc(cx, cy - 34, 30, 0, Math.PI * 2); k.fill();
  k.globalCompositeOperation = 'destination-out';
  k.beginPath(); k.arc(cx, cy - 34, 12, 0, Math.PI * 2); k.fill();
  k.globalCompositeOperation = 'source-over';
  k.fillRect(cx - 7, cy - 8, 14, 84);
  k.fillRect(cx + 7, cy + 40, 18, 10);
  k.fillRect(cx + 7, cy + 60, 12, 10);
  const img = k.getImageData(0, 0, W, H).data;
  x.fillStyle = 'rgba(20,20,20,0.82)';
  for (let px = 840; px < 960; px += 5) {
    for (let py = 140; py < 300; py += 5) {
      if (img[(py * W + px) * 4 + 3] > 128) x.fillRect(px, py, 2.5, 2.5);
    }
  }
});
</script>
</body>
</html>
