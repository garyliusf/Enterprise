<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bolt.new channel banners — Luma + YouTube</title>
<!--
  Channel cover images for the Bolt.new Training Luma calendar and the YouTube
  channel, built on the current light-hero branding (solutions.html hero:
  navy → brand-blue ramp, Bayer dither, Literata italic + Schibsted lockup).

  Render:  python3 marketing/banners/render.py   → marketing/banners/out/*.png
  Preview: http://localhost:8765/marketing/banners/channel-banners.html?v=luma
           http://localhost:8765/marketing/banners/channel-banners.html?v=yt

  Sizes:  Luma 2100 × 600 · YouTube 2560 × 1440 (safe area 1546 × 423, centred)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1488FC;
    --sans: 'Schibsted Grotesk', 'Inter', system-ui, sans-serif;
    --serif: 'Literata', Georgia, serif;
  }
  html, body { margin: 0; background: #f3f4f6; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  /* ── The banner canvas ───────────────────────────────────────────────── */
  .banner {
    position: relative; overflow: hidden; color: #fff;
    /* The site's light-hero ramp (shared-components.css --sc-hero-bg), the
       bottom stops dropped: a channel cover ends on the blue, not on white,
       so the rounded card edge stays visible on Luma's white page. */
    background:
      linear-gradient(180deg,
        #021a57 0%, #04246c 14%, #072f86 26%, #0a3f9e 38%,
        #1259c3 52%, #3b82cf 66%, #6ba6da 80%, #a3c8e6 100%);
  }
  .banner canvas.dither { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  /* a soft rim light low on the canvas — the "bright rim hugging the arc" the
     hero token describes, as one wide ellipse so it reads as light, not a band */
  .banner::after {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 70% 42% at 50% 112%, rgba(190,225,255,0.55), rgba(110,170,235,0.18) 55%, transparent 75%);
  }

  /* ── Luma: 2100 × 600 ───────────────────────────────────────────────── */
  .banner--luma { width: 2100px; height: 600px; }
  .banner--luma .safe { position: absolute; inset: 0; }

  /* ── YouTube: 2560 × 1440, content inside the 1546 × 423 safe area ──── */
  .banner--yt { width: 2560px; height: 1440px; }
  .banner--yt .safe {
    position: absolute; width: 1546px; height: 423px;
    left: 507px; top: 508.5px;           /* centred */
  }
  /* review-only guide for the safe area; hidden at render time (?guide=1 shows it) */
  .banner--yt .safe-guide { position: absolute; inset: 0; outline: 1px dashed rgba(255,255,255,0.35); display: none; }
  html[data-guide] .banner--yt .safe-guide { display: block; }

  /* ── Content inside the safe area ───────────────────────────────────── */
  .safe { z-index: 3; }
  .copy {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 0;
  }
  .wordmark { display: block; height: 42px; width: auto; margin: 0 0 30px 2px; }
  .wordmark svg { height: 100%; width: auto; display: block; }
  .h1 { margin: 0; font-weight: 500; font-size: 112px; line-height: 1.02; letter-spacing: -1px; color: #fff; }
  .h1 .serif { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0; display: block; margin-bottom: 8px; }
  .sub { margin: 22px 0 0 2px; font-size: 30px; font-weight: 400; color: rgba(255,255,255,0.86); letter-spacing: -0.1px; }

  /* Luma gets more horizontal room, so the lockup sets a touch larger */
  .banner--luma .copy { left: 120px; top: 46%; }  /* lifted: Luma's avatar overlaps the bottom-left corner */
  .banner--luma .wordmark { height: 46px; margin-bottom: 34px; }
  .banner--luma .h1 { font-size: 124px; }
  .banner--luma .sub { font-size: 32px; }

  /* The YouTube safe area is only 423px tall: tighter lockup, no subtitle */
  .banner--yt .copy { left: 0; }
  .banner--yt .wordmark { height: 34px; margin-bottom: 22px; }
  .banner--yt .h1 { font-size: 92px; }
  .banner--yt .sub { font-size: 26px; margin-top: 16px; }

  /* ── Callout (the Luma follow prompt) ───────────────────────────────── */
  .callout {
    position: absolute; right: 0; display: flex; flex-direction: column; align-items: flex-end;
    text-align: right; gap: 10px;
  }
  .callout .label { font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #fff; opacity: 0.92; }
  .callout .line { font-size: 30px; font-weight: 500; color: #fff; line-height: 1.2; }
  .callout .line b { font-weight: 700; }
  .callout .arrow { width: 68px; height: 86px; display: block; margin-top: 8px; margin-right: 2px; }
  .callout .arrow path { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

  /* Luma: the Follow button sits under the banner's bottom-right corner on
     the profile page, so the prompt hugs that corner and the arrow points down. */
  .banner--luma .callout { right: 112px; bottom: 44px; }
  /* YouTube: the Subscribe button is below the banner too, but the prompt is
     about Luma — a pill with the Luma handle, bottom-right of the safe area. */
  .banner--yt .callout { right: 0; bottom: 0; align-items: flex-end; }
  .banner--yt .callout .line { font-size: 26px; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 26px;
    background: var(--blue); color: #fff; border-radius: 2px;
    font-size: 24px; font-weight: 600; letter-spacing: -0.1px;
  }
  .pill svg { width: 22px; height: 22px; display: block; }
  .pill--ghost { background: transparent; border: 1.5px solid rgba(255,255,255,0.4); font-weight: 500; }

  /* ── Variant switch (query string) ──────────────────────────────────── */
  .banner { display: none; }
  html[data-v="luma"] .banner--luma, html[data-v="yt"] .banner--yt { display: block; }
</style>
</head>
<body>

<!-- ─── LUMA 2100 × 600 ─────────────────────────────────────────────────── -->
<div class="banner banner--luma" id="luma">
  <canvas class="dither"></canvas>
  <div class="safe">
    <div class="copy">
      <span class="wordmark" aria-label="bolt.new">
        <svg viewBox="0 0 85 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><use href="#bolt-new-wordmark"/></svg>
      </span>
      <h1 class="h1"><span class="serif">What do you want to build?</span>Learn how, live.</h1>
      <p class="sub">Training sessions and workshops from the Bolt team.</p>
    </div>
    <div class="callout">
      <span class="line">Follow <b>to see our events</b></span>
      <svg class="arrow" viewBox="0 0 56 72" aria-hidden="true">
        <path d="M6 4 C 44 10, 52 34, 40 62"/>
        <path d="M30 54 L40 62 L49 52"/>
      </svg>
    </div>
  </div>
</div>

<!-- ─── YOUTUBE 2560 × 1440 (safe 1546 × 423) ───────────────────────────── -->
<div class="banner banner--yt" id="yt">
  <canvas class="dither"></canvas>
  <div class="safe">
    <div class="safe-guide"></div>
    <div class="copy">
      <span class="wordmark" aria-label="bolt.new">
        <svg viewBox="0 0 85 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><use href="#bolt-new-wordmark"/></svg>
      </span>
      <h1 class="h1"><span class="serif">What do you want to build?</span>Learn how, live.</h1>
      <p class="sub">Training sessions and workshops from the Bolt team.</p>
    </div>
    <div class="callout">
      <span class="line">Live events, every week</span>
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2c0 5.52 4.48 10 10 10-5.52 0-10 4.48-10 10 0-5.52-4.48-10-10-10 5.52 0 10-4.48 10-10z" fill="#fff"/></svg>
        Follow us on Luma
      </span>
    </div>
  </div>
</div>

<script>
  // variant from the query string: ?v=luma | ?v=yt  (default luma); ?guide=1 shows the YT safe area
  (function () {
    var q = new URLSearchParams(location.search);
    document.documentElement.setAttribute('data-v', q.get('v') === 'yt' ? 'yt' : 'luma');
    if (q.get('guide')) document.documentElement.setAttribute('data-guide', '1');
  })();

  // Static Bayer 4x4 dither — the security/solutions hero field, drawn once.
  // Dense at the crown, thinning down the ramp, thinning toward the sides.
  document.querySelectorAll('.banner canvas.dither').forEach(function (canvas) {
    var banner = canvas.parentElement;
    var W = banner.offsetWidth, H = banner.offsetHeight;
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    var CELL = 5, SQ = 2;
    var cols = Math.ceil(W / CELL) + 1, rows = Math.ceil(H / CELL) + 1;
    var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    for (var r = 0; r < rows; r++) {
      var gy = r / rows;
      var base = 1 - gy / 0.98;
      if (base <= 0) continue;
      base = Math.pow(base, 0.75);
      for (var c = 0; c < cols; c++) {
        var gx = c / cols;
        var wave = Math.sin(gx * 4.1 + gy * 6.3) * 0.5 + Math.sin(gx * 7.7 - gy * 3.1) * 0.28;
        var hm = 1 - Math.pow(Math.abs(gx - 0.5) * 2, 2.2) * 0.85;
        var level = base * hm + wave * 0.38;
        var th = (BAYER[r & 3][c & 3] + 0.5) / 16;
        if (level <= th) continue;
        var a = 0.085 + base * 0.13;
        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        ctx.fillRect(c * CELL, r * CELL, SQ, SQ);
      }
    }
  });
</script>
</body>
