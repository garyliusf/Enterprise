<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We're Hiring — Bolt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Swap this for the supplied background (image url or gradient) */
    --poster-bg: radial-gradient(120% 100% at 50% 0%, #14141a 0%, #000 70%);
  }

  html, body { background: #000; height: 100%; }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
  }

  /* 4:5 poster canvas */
  .poster {
    position: relative;
    width: min(800px, 92vw);
    aspect-ratio: 4 / 5;
    background: var(--poster-bg);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    border-radius: 6px;
    perspective: 1400px;
  }

  /* Soft glow that rotates behind the b */
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 70%;
    height: 55%;
    transform: translate(-50%, -50%);
    background: radial-gradient(50% 50% at 50% 50%,
                rgba(214,140,60,0.35) 0%,
                rgba(40,90,170,0.22) 45%,
                rgba(0,0,0,0) 72%);
    filter: blur(20px);
    animation: glowspin 9s linear infinite;
  }

  @keyframes glowspin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* The 3D bolt "b" */
  .b-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 46%;
    transform: translate(-50%, -50%);
    transform-style: preserve-3d;
    animation: float 6s ease-in-out infinite;
  }

  .b {
    display: block;
    width: 100%;
    height: auto;
    transform-style: preserve-3d;
    animation: spin 5s linear infinite;
    filter: drop-shadow(0 30px 50px rgba(0,0,0,0.55));
    will-change: transform;
  }

  /* full 360° turntable — slight constant X tilt so it never fully vanishes edge-on */
  @keyframes spin {
    0%   { transform: rotateX(8deg) rotateY(0deg); }
    100% { transform: rotateX(8deg) rotateY(360deg); }
  }

  @keyframes float {
    0%, 100% { transform: translate(-50%, -52%); }
    50%      { transform: translate(-50%, -48%); }
  }

  /* Text chip */
  .chip {
    position: absolute;
    top: 8%;
    left: 8%;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 14px 26px;
    border-radius: 14px;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: #fff;
    font-size: clamp(28px, 6vw, 54px);
    line-height: 1;
    z-index: 3;
  }

  /* Bolt wordmark bottom-left */
  .brand {
    position: absolute;
    bottom: 6%;
    left: 8%;
    z-index: 3;
  }
  .brand svg { display: block; width: clamp(90px, 14vw, 130px); height: auto; }

  @media (prefers-reduced-motion: reduce) {
    .glow, .b, .b-wrap { animation: none; }
    .b { transform: rotateY(-14deg) rotateX(8deg); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="poster">
      <div class="glow"></div>

      <div class="b-wrap">
        <img class="b" src="../images/referral-hero-b.png" alt="Bolt b" />
      </div>

      <div class="chip">We're Hiring</div>
