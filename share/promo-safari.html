<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bolt.new — Now on Safari</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* ---- Stage: 1280x720 (16:9) so a screen-recording crop is clean ---- */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 800px at 50% 42%, rgba(20,136,252,0.10), transparent 60%),
      #000;
  }

  /* faint pixel grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(closest-side at 50% 45%, #000 40%, transparent 78%);
    -webkit-mask-image: radial-gradient(closest-side at 50% 45%, #000 40%, transparent 78%);
    animation: gridFade 8s linear infinite;
  }
  @keyframes gridFade {
    0%, 100% { opacity: 0; }
    16%, 82% { opacity: 1; }
  }

  .scene {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    z-index: 2;
    transform: translateY(-40px);
  }

  /* ---------- Compass ---------- */
  .compass {
    width: 128px; height: 128px;
    margin-bottom: 52px;
    filter: drop-shadow(0 12px 40px rgba(20,136,252,0.35));
    animation: compassIn 8s cubic-bezier(.2,.8,.2,1) infinite;
  }
  @keyframes compassIn {
    0%      { opacity: 0; transform: scale(.4) rotate(-140deg); }
    8%      { opacity: 0; transform: scale(.4) rotate(-140deg); }
    27%     { opacity: 1; transform: scale(1)  rotate(0deg); }
    80%     { opacity: 1; transform: scale(1)  rotate(0deg); }
    90%,100%{ opacity: 0; transform: scale(.9) rotate(20deg); }
  }
  /* needle keeps a subtle live wobble once settled */
  .needle {
    transform-origin: 64px 64px;
    animation: needleSpin 8s cubic-bezier(.2,.8,.2,1) infinite;
  }
  @keyframes needleSpin {
    0%,8%   { transform: rotate(-320deg); }
    27%     { transform: rotate(-8deg); }
    36%     { transform: rotate(6deg); }
    50%     { transform: rotate(-2deg); }
    80%,100%{ transform: rotate(0deg); }
  }
  /* spark flash behind the wordmark handoff */
  .spark {
    position: absolute;
    top: 64px; left: 50%;
    width: 260px; height: 260px;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(20,136,252,0.55), transparent 62%);
    opacity: 0;
    animation: sparkFlash 8s ease-out infinite;
    pointer-events: none;
  }
  @keyframes sparkFlash {
    0%,22%   { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    27%      { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
    37%      { opacity: 0; transform: translate(-50%,-50%) scale(1.4); }
    100%     { opacity: 0; }
  }

  /* ---------- Wordmark ---------- */
  .wordmark {
    width: 150px;
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeUp 8s ease-out infinite;
  }
  .wordmark svg { width: 100%; height: auto; display: block; }
  @keyframes fadeUp {
    0%,27%   { opacity: 0; transform: translateY(12px); }
    40%      { opacity: 1; transform: translateY(0); }
    81%      { opacity: 1; transform: translateY(0); }
    91%,100% { opacity: 0; transform: translateY(-8px); }
  }

  /* ---------- Headline ---------- */
  .headline {
    font-size: 60px;
    font-weight: 600;
    letter-spacing: -1.5px;
    line-height: 1.05;
    color: #fff;
    margin-bottom: 16px;
  }
  .headline .w {
    display: inline-block;
    opacity: 0;
    filter: blur(10px);
    transform: translateY(14px);
  }
  .headline .safari {
    background: linear-gradient(90deg, #1488FC, #6db6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .headline .w:nth-child(1){ animation: wordIn 8s ease-out infinite; }
  .headline .w:nth-child(2){ animation: wordIn 8s ease-out infinite; animation-delay: .12s; }
  .headline .w:nth-child(3){ animation: wordIn 8s ease-out infinite; animation-delay: .24s; }
  @keyframes wordIn {
    0%,40%   { opacity: 0; filter: blur(10px); transform: translateY(14px); }
    53%      { opacity: 1; filter: blur(0);   transform: translateY(0); }
    81%      { opacity: 1; filter: blur(0);   transform: translateY(0); }
    91%,100% { opacity: 0; filter: blur(6px); transform: translateY(-8px); }
  }

  /* ---------- Subline ---------- */
  .subline {
    font-size: 19px;
    font-weight: 400;
    color: #ABABAB;
    max-width: 520px;
    line-height: 1.5;
    margin-bottom: 0;
    opacity: 0;
    animation: subIn 8s ease-out infinite;
  }
  @keyframes subIn {
    0%,52%   { opacity: 0; transform: translateY(10px); }
    64%      { opacity: 1; transform: translateY(0); }
    81%      { opacity: 1; transform: translateY(0); }
    91%,100% { opacity: 0; transform: translateY(-6px); }
  }

  /* ---------- CTA ---------- */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 30px;
    background: #1488FC;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border-radius: 6px;
    box-shadow: 0 10px 34px rgba(20,136,252,0.45);
    opacity: 0;
    animation: ctaIn 8s cubic-bezier(.2,.9,.2,1) infinite;
  }
  .cta svg { width: 16px; height: 16px; }
  @keyframes ctaIn {
    0%,54%   { opacity: 0; transform: translateY(12px) scale(.94); }
    62%      { opacity: 1; transform: translateY(0) scale(1.04); }
    66%      { transform: translateY(0) scale(1); }
    88%      { opacity: 1; transform: translateY(0) scale(1); }
    96%,100% { opacity: 0; transform: translateY(-6px) scale(.98); }
  }

  /* progress hairline at the bottom — reads as a "video" affordance */
  .progress {
    position: absolute;
    left: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, #1488FC, #6db6ff);
    animation: prog 8s linear infinite;
    z-index: 5;
  }
  @keyframes prog { 0%{ width: 0; } 100%{ width: 100%; } }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="scene">
    <div style="position:relative;">
      <div class="spark"></div>
      <!-- Safari-style compass -->
      <svg class="compass" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ring" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2a2c33"/>
            <stop offset="1" stop-color="#0c0d10"/>
          </linearGradient>
          <linearGradient id="needleN" x1="64" y1="30" x2="64" y2="64" gradientUnits="userSpaceOnUse">

        <!-- outer ring -->

          <line x1="106" y1="64" x2="114" y2="64"/>

        <g stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-linecap="round">
          <line x1="93.5" y1="27" x2="88" y2="33"/>
          <line x1="34.5" y1="27" x2="40" y2="33"/>
          <line x1="93.5" y1="101" x2="88" y2="95"/>
          <line x1="34.5" y1="101" x2="40" y2="95"/>
        </g>
        <!-- needle -->
        <g class="needle">
          <path d="M64 30 L74 66 L64 60 Z" fill="url(#needleN)"/>
          <path d="M64 98 L54 62 L64 68 Z" fill="#e9edf5"/>
          <path d="M64 30 L54 66 L64 60 Z" fill="#ff8079"/>
          <path d="M64 98 L74 62 L64 68 Z" fill="#c7ccd6"/>
        </g>
        <circle cx="64" cy="64" r="5" fill="#14151a" stroke="#1488FC" stroke-width="2"/>
      </svg>
    </div>

      </svg>
    </div>

    <h1 class="headline">
      <span class="w">Now</span>
      <span class="w">on</span>
      <span class="w safari">Safari</span>
    </h1>

    <p class="subline">A smoother bolt.new — now running beautifully in Safari.</p>
  </div>

  <div class="progress"></div>
</div>
</body>
</html>
