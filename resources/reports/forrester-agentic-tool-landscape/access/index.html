<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your report is ready — Bolt</title>
<meta name="description" content="The Forrester Agentic Development Platforms Landscape, Q3 2026 — ready to view.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ─── BASE ─────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: #000; font-family: 'Inter', sans-serif; overflow-x: hidden; color: #fff; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }

/* ─── ACCESS HERO ─────────────────────────────────────────────────────────
   Single-column success state — same ambient glow background as the landing
   page's hero, centered content, no form. */
.access-section {
  width: 100%;
  min-height: 100dvh;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: clamp(132px, 14vh, 184px) 24px clamp(72px, 8vh, 112px);
  background:
    radial-gradient(ellipse 60% 55% at 22% 20%, rgba(20,60,120,0.42) 0%, transparent 65%),
    radial-gradient(ellipse 55% 50% at 82% 18%, rgba(190,120,80,0.20) 0%, transparent 65%),
    radial-gradient(ellipse 70% 60% at 50% 100%, rgba(0,0,0,0.6) 0%, transparent 70%),
    #050810;
}
.access-inner { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

.access-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(20,136,252,0.12);
  border: 1px solid rgba(20,136,252,0.35);
  color: #1488FC;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px;
}
.access-eyebrow {
  font-family: 'Silkscreen', monospace;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #1488FC;
}
.access-h1 { font-size: clamp(32px, 4vw, 44px); font-weight: 500; color: #fff; line-height: 1.15; }
.access-subtitle { font-size: clamp(15px, 1.2vw, 17px); color: #ABABAB; line-height: 1.55; max-width: 420px; }

.report-cover {
  width: 100%;
  max-width: 320px;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  display: block;
  margin: 8px 0 4px;
}

.access-fineprint { margin-top: 4px; font-size: 12px; line-height: 1.55; color: rgba(255,255,255,0.4); }

/* ─── PRIMARY BUTTON (canonical structure) ──────────────────────────────── */
.hero-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 52px; padding: 0 28px;
  background: #1488FC; border: none; border-radius: 2px;
  color: #fff; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
  cursor: pointer; text-decoration: none;
  position: relative; overflow: hidden;
  transition: opacity 0.2s;
  min-width: 200px;
}
.hero-btn-primary .btn-bg-hover { position: absolute; inset: 0; background: #0f6fd0; z-index: 1; transform: translateY(101%); transition: transform 0.45s cubic-bezier(0.165, 0.84, 0.44, 1); }
.hero-btn-primary .btn-text-wrap { position: relative; z-index: 3; overflow: hidden; height: 1.2em; display: flex; align-items: center; gap: 10px; }
.hero-btn-primary .btn-text-inner { display: flex; flex-direction: column; transition: transform 0.45s cubic-bezier(0.165, 0.84, 0.44, 1); }
.hero-btn-primary .btn-text-inner span { display: block; line-height: 1.2; }
.hero-btn-primary:hover .btn-bg-hover { transform: translateY(0); }
.hero-btn-primary:hover .btn-text-inner { transform: translateY(-50%); }
.hero-btn-primary.btn-pixelized .btn-bg-hover { display: none !important; }
.hero-btn-primary.btn-pixelized .btn-text-inner { transform: none !important; }
.hero-btn-primary.btn-pixelized .btn-text-inner span:nth-child(2) { display: none; }
.hero-btn-primary.btn-pixelized .btn-text-wrap { z-index: 3; }

@media (max-width: 768px) {
  .access-section { padding: 92px 20px 56px; min-height: 0; }
  .hero-btn-primary { height: 44px; padding: 0 18px; font-size: 14px; min-width: 0; width: 100%; max-width: 320px; }
}
</style>
</head>
<body>

<!-- NAV: Astro-injected in production -->

<!-- ─── ACCESS / SUCCESS STATE ───────────────────────────────────────────── -->
<section class="access-section">
  <div class="access-inner">
    <div class="access-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4 10-11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <p class="access-eyebrow">Forrester Research</p>
    <h1 class="access-h1">Your report is ready</h1>
    <p class="access-subtitle">Thanks — click below to open The Forrester Agentic Development Platforms Landscape, Q3 2026.</p>

    <img class="report-cover" src="../images/report-cover.jpg" alt="The Forrester Agentic Development Platforms Landscape, Q3 2026 report cover">

    <a href="./forrester-report.pdf" target="_blank" rel="noopener" class="hero-btn-primary">
      <div class="btn-bg-hover"></div>
      <div class="btn-text-wrap">
        <div class="btn-text-inner">
          <span>Open the PDF</span>
          <span>Open the PDF</span>
        </div>
      </div>
    </a>

    <p class="access-fineprint">The Forrester Agentic Development Platforms Landscape, Q3 2026, Diego Lo Giudice, Forrester Research. Shared With Permission.</p>
  </div>
</section>

<!-- Shared standardized components (canonical source — wins the cascade) -->
<link rel="stylesheet" href="../../../../marketing/shared-components.css">
<script src="../../../../marketing/shared-components.js"></script>
</body>
</html>
